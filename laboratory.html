<!DOCTYPE html>
<html>
<head>
    <title>VBS - Laboratory Report</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 20px auto; padding: 20px; background: #f5f5f5; }
        .container { background: white; padding: 20px; border-radius: 10px; }
        h1 { color: #2c7a4d; }
        h3 { color: #1a5a3a; margin-bottom: 5px; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        textarea { min-height: 60px; }
        button { width: 100%; padding: 12px; margin-top: 20px; background: #2c7a4d; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:disabled { background: #aaa; cursor: not-allowed; }
        .section { margin-top: 20px; padding: 10px; background: #f8f9fa; border-radius: 8px; }
        .row { display: flex; gap: 15px; flex-wrap: wrap; }
        .row > div { flex: 1; min-width: 150px; }
        .error-msg { color: red; margin-top: 10px; padding: 10px; background: #ffebee; border-radius: 5px; display: none; }
        .success-msg { color: green; margin-top: 10px; padding: 10px; background: #e8f5e9; border-radius: 5px; display: none; }
        .loading { display: inline-block; width: 16px; height: 16px; border: 2px solid white; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; margin-left: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔬 Laboratory Report</h1>
        <p>Santo Lab (Galana Siro) | Port Vila Lab (Rollina Kelep)</p>
        
        <div id="errorMsg" class="error-msg"></div>
        <div id="successMsg" class="success-msg"></div>
        
        <form id="reportForm">
            <!-- Basic Info -->
            <div class="section">
                <h3>📋 Basic Information</h3>
                <div class="row">
                    <div>
                        <label>Officer Name:</label>
                        <input name="officer_name" id="officerName" required>
                    </div>
                    <div>
                        <label>Report Date:</label>
                        <input name="report_date" type="date" id="reportDate" required>
                    </div>
                </div>
                <label>Lab Location:</label>
                <select name="lab_location" required>
                    <option value="Port Vila">Port Vila Laboratory</option>
                    <option value="Santo">Santo Laboratory</option>
                </select>
            </div>
            
            <!-- Sample Information -->
            <div class="section">
                <h3>🧪 Sample Information</h3>
                <div class="row">
                    <div>
                        <label>Sample ID:</label>
                        <input name="sample_id" placeholder="e.g., Kava powder / BVKAN01000426" required>
                    </div>
                    <div>
                        <label>Sample Type:</label>
                        <select name="sample_type" required>
                            <option value="Food">Food</option>
                            <option value="Water">Water</option>
                            <option value="Soil">Soil</option>
                            <option value="Cosmetic">Cosmetic</option>
                            <option value="Beverages">Beverages</option>
                            <option value="Kava">Kava</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <!-- Test Details -->
            <div class="section">
                <h3>🔬 Test Details</h3>
                <div class="row">
                    <div>
                        <label>Test Type:</label>
                        <select name="test_type" required>
                            <option value="Chemical">Chemical</option>
                            <option value="Microbiology">Microbiology</option>
                            <option value="DNA/GMO">DNA/GMO</option>
                            <option value="Nobility">Nobility Test (Kava)</option>
                        </select>
                    </div>
                    <div>
                        <label>Number of Tests:</label>
                        <input name="lab_tests_conducted" type="number" value="1" min="1">
                    </div>
                </div>
                
                <div class="row">
                    <div>
                        <label>Test Result:</label>
                        <select name="test_result" required>
                            <option value="Pass">✅ Pass</option>
                            <option value="Fail">❌ Fail</option>
                            <option value="Inconclusive">⚠️ Inconclusive</option>
                            <option value="Pending">⏳ Pending</option>
                        </select>
                    </div>
                    <div>
                        <label>Reagent Status:</label>
                        <select name="reagent_status">
                            <option value="Good">Good</option>
                            <option value="Low">Low - Order soon</option>
                            <option value="Critical">Critical - Order immediately</option>
                        </select>
                    </div>
                </div>
                
                <label>Equipment Issues:</label>
                <textarea name="equipment_issues" rows="2" placeholder="e.g., Colorimeter, centrifuge issues..."></textarea>
            </div>
            
            <!-- Dates -->
            <div class="section">
                <h3>📅 Dates</h3>
                <div class="row">
                    <div>
                        <label>Date Sample Received:</label>
                        <input name="date_sample_received" type="date">
                    </div>
                    <div>
                        <label>Date Result Completed:</label>
                        <input name="date_result_completed" type="date">
                    </div>
                </div>
                <div class="row">
                    <div>
                        <label>Turnaround Days:</label>
                        <input name="turnaround_days" type="number" value="0" min="0">
                    </div>
                    <div>
                        <label>Calibration Due Date:</label>
                        <input name="calibration_due_date" type="date">
                    </div>
                </div>
            </div>
            
            <!-- Certificate -->
            <div class="section">
                <h3>📜 Certificate</h3>
                <div class="row">
                    <div>
                        <label>Certificate Number:</label>
                        <input name="certificate_number" placeholder="e.g., 01BV220426">
                    </div>
                    <div>
                        <label>Non-Compliance Cases:</label>
                        <input name="non_compliance_cases" type="number" value="0" min="0">
                    </div>
                </div>
            </div>
            
            <!-- Comments -->
            <div class="section">
                <h3>📝 Comments</h3>
                <label>Inspector Notes:</label>
                <textarea name="inspector_notes" rows="3" placeholder="Enter your analysis comments..."></textarea>
            </div>
            
            <!-- Working Hours -->
            <div class="section">
                <h3>⏰ Working Hours</h3>
                <div class="row">
                    <div>
                        <label>Time In:</label>
                        <input name="time_in" type="time">
                    </div>
                    <div>
                        <label>Time Out:</label>
                        <input name="time_out" type="time">
                    </div>
                </div>
                <div class="row">
                    <div>
                        <label>Hours Worked:</label>
                        <input name="hours_worked" type="number" step="0.5" value="8">
                    </div>
                    <div>
                        <label>Tasks Completed:</label>
                        <input name="tasks_completed" type="number" value="1" min="1">
                    </div>
                </div>
            </div>
            
            <button type="submit" id="submitBtn">Submit Laboratory Report</button>
        </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Use a unique variable name to avoid conflicts
        const VBS_SUPABASE_URL = 'https://pdwctzueksfuspwwumdy.supabase.co';
        const VBS_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkd2N0enVla3NmdXNwd3d1bWR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4MTA3NDQsImV4cCI6MjA5MjM4Njc0NH0.Xi7MH3MLuxDx1FK6BKLJi-n47SQn-gPgWxq35NuRpZY';
        
        let vbsSupabaseClient = null;
        
        // Initialize Supabase
        if (typeof window.supabase !== 'undefined') {
            vbsSupabaseClient = window.supabase.createClient(VBS_SUPABASE_URL, VBS_SUPABASE_KEY);
            console.log('Supabase initialized');
        }
        
        // Set default date
        document.getElementById('reportDate').value = new Date().toISOString().split('T')[0];
        
        // Try to get user info from localStorage
        const userEmail = localStorage.getItem('vbs_user');
        const officerNameInput = document.getElementById('officerName');
        if (userEmail && officerNameInput) {
            officerNameInput.value = userEmail.split('@')[0];
        }
        
        // Auto-calculate turnaround days
        function calculateTurnaround() {
            const received = document.querySelector('input[name="date_sample_received"]').value;
            const completed = document.querySelector('input[name="date_result_completed"]').value;
            
            if (received && completed) {
                const start = new Date(received);
                const end = new Date(completed);
                const diffTime = Math.abs(end - start);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                document.querySelector('input[name="turnaround_days"]').value = diffDays;
            }
        }
        
        document.querySelector('input[name="date_sample_received"]').addEventListener('change', calculateTurnaround);
        document.querySelector('input[name="date_result_completed"]').addEventListener('change', calculateTurnaround);
        
        // Calculate hours worked
        function calculateHours() {
            const timeIn = document.querySelector('input[name="time_in"]').value;
            const timeOut = document.querySelector('input[name="time_out"]').value;
            
            if (timeIn && timeOut) {
                const inParts = timeIn.split(':');
                const outParts = timeOut.split(':');
                let hours = parseInt(outParts[0]) - parseInt(inParts[0]);
                let minutes = parseInt(outParts[1]) - parseInt(inParts[1]);
                if (minutes < 0) { hours--; minutes += 60; }
                const totalHours = hours + minutes / 60;
                if (totalHours > 0) {
                    document.querySelector('input[name="hours_worked"]').value = totalHours.toFixed(1);
                }
            }
        }
        
        document.querySelector('input[name="time_in"]').addEventListener('change', calculateHours);
        document.querySelector('input[name="time_out"]').addEventListener('change', calculateHours);
        
        // Form submission
        document.getElementById('reportForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const errorDiv = document.getElementById('errorMsg');
            const successDiv = document.getElementById('successMsg');
            const submitBtn = document.getElementById('submitBtn');
            
            // Hide previous messages
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            // Get token from localStorage
            const token = localStorage.getItem('vbs_token');
            if (!token) {
                errorDiv.innerHTML = '❌ You are not logged in. Please login first.';
                errorDiv.style.display = 'block';
                return;
            }
            
            // Collect form data
            const formData = new FormData(e.target);
            const data = {};
            
            for (let [key, value] of formData.entries()) {
                if (value !== null && value !== '') {
                    // Convert numeric fields
                    if (key === 'lab_tests_conducted' || key === 'non_compliance_cases' || key === 'tasks_completed' || key === 'turnaround_days') {
                        data[key] = parseInt(value) || 0;
                    } else if (key === 'hours_worked') {
                        data[key] = parseFloat(value) || 0;
                    } else {
                        data[key] = value;
                    }
                }
            }
            
            // Add required fields
            data.status = 'PENDING';
            data.created_at = new Date().toISOString();
            
            console.log('Submitting data:', data);
            
            // Disable button and show loading
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Submitting... <span class="loading"></span>';
            
            try {
                // Using fetch directly with token
                const response = await fetch(`${VBS_SUPABASE_URL}/rest/v1/laboratory_reports`, {
                    method: 'POST',
                    headers: { 
                        'apikey': VBS_SUPABASE_KEY, 
                        'Authorization': `Bearer ${token}`, 
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify(data)
                });
                
                const responseText = await response.text();
                console.log('Response status:', response.status);
                console.log('Response body:', responseText);
                
                if (response.ok) {
                    successDiv.innerHTML = '✅ Laboratory report submitted successfully! Manager will review.';
                    successDiv.style.display = 'block';
                    document.getElementById('reportForm').reset();
                    document.getElementById('reportDate').value = new Date().toISOString().split('T')[0];
                    document.querySelector('input[name="hours_worked"]').value = 8;
                    document.querySelector('input[name="lab_tests_conducted"]').value = 1;
                    document.querySelector('input[name="non_compliance_cases"]').value = 0;
                    document.querySelector('input[name="tasks_completed"]').value = 1;
                    document.querySelector('select[name="reagent_status"]').value = 'Good';
                    
                    // Refresh officer name
                    if (userEmail) {
                        document.getElementById('officerName').value = userEmail.split('@')[0];
                    }
                    
                    // Scroll to success message
                    successDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else {
                    errorDiv.innerHTML = `❌ Error: ${responseText}`;
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                console.error('Submit error:', error);
                errorDiv.innerHTML = `❌ Connection error: ${error.message}`;
                errorDiv.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Submit Laboratory Report';
            }
        });
        
        // Resubmit handling for rejected reports
        window.onload = function() {
            const resubmitMode = localStorage.getItem('resubmit_mode');
            if (resubmitMode === 'true') {
                const resubmitData = JSON.parse(localStorage.getItem('resubmit_data'));
                if (resubmitData) {
                    alert(`⚠️ This report was previously rejected.\n\nManager comment: ${resubmitData.comment || 'No comment'}\n\nPlease fix the issue and resubmit.`);
                    
                    const form = document.getElementById('reportForm');
                    if (form && resubmitData.report) {
                        for (let key in resubmitData.report) {
                            let field = form.querySelector(`[name="${key}"]`);
                            if (field && key !== 'id' && key !== 'created_at' && key !== 'status') {
                                field.value = resubmitData.report[key];
                            }
                        }
                    }
                    localStorage.removeItem('resubmit_mode');
                    localStorage.removeItem('resubmit_data');
                }
            }
        };
    </script>
</body>
</html>
